<html lang="uk">
<head>

<meta property="og:title" content="МаксСервіс — автосервіс у Кропивницькому">

<meta name="theme-color" content="#14171c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171c'/%3E%3Cpath d='M12 48V16h8l12 18 12-18h8v32h-8V31L32 49 20 31v17z' fill='%23ff6a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* GLOBAL STYLES */
:root{--primary-color:#ff6a1a;--secondary-color:#232a33;--background-color:#14171c;--surface-color:#1d2229;--text-color:#f4f5f7;--muted-color:#9aa3ae;--card-radius:6px;--button-radius:4px;--container-width:1180px;--font-body:'Barlow',system-ui,sans-serif;--font-head:'Barlow Condensed','Arial Narrow',sans-serif;--line:rgba(255,255,255,.09);--header-h:64px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--header-h)}
body{font-family:var(--font-body);background:var(--background-color);color:var(--text-color);line-height:1.6;font-size:16px;overflow-x:hidden;-webkit-text-size-adjust:100%}
img,svg,iframe{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);line-height:1.05;letter-spacing:.01em}
h1{font-size:clamp(2.6rem,9vw,5.2rem);font-weight:800}
h2{font-size:clamp(2rem,5.5vw,3rem);font-weight:700}
h3{font-size:1.4rem;font-weight:700}
.container{width:100%;max-width:var(--container-width);margin:0 auto;padding:0 18px}
.section{padding:64px 0}
.section-head{margin-bottom:32px;max-width:640px}
.section-head p{color:var(--muted-color);margin-top:10px}
.muted{color:var(--muted-color)}
:focus-visible{outline:2px solid var(--primary-color);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:2px solid var(--primary-color);border-radius:var(--button-radius);background:var(--primary-color);color:#111;font-weight:600;cursor:pointer;transition:transform .15s,background .15s,color .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text-color);border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{border-color:var(--primary-color);color:var(--primary-color)}
.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn svg,.ic{width:20px;height:20px;flex:none}
/* HEADER */
.header{position:sticky;top:0;z-index:50;background:rgba(20,23,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header .container{display:flex;align-items:center;justify-content:space-between;height:var(--header-h);gap:14px}
.brand{font-family:var(--font-head);font-size:1.7rem;font-weight:800;display:flex;align-items:center;gap:10px}
.brand img{height:36px;width:auto}
.brand b{color:var(--primary-color)}
.nav{display:none;gap:22px}
.nav a{color:var(--muted-color);font-weight:500;transition:color .15s}
.nav a:hover{color:var(--text-color)}
.head-actions{display:none;align-items:center;gap:14px}
.head-phone{font-weight:600}
.burger{width:44px;height:44px;background:none;border:1px solid var(--line);border-radius:var(--button-radius);cursor:pointer;display:grid;place-items:center}
.mnav{display:none;flex-direction:column;padding:8px 18px 18px;border-top:1px solid var(--line);background:var(--background-color)}
.mnav.open{display:flex}
.mnav a{padding:14px 0;border-bottom:1px solid var(--line);font-weight:500}
@media(min-width:960px){.nav,.head-actions{display:flex}.burger,.mnav{display:none!important}}
/* HERO SECTION */
.hero{position:relative;padding:72px 0 56px;background:radial-gradient(900px 420px at 85% 0,rgba(255,106,26,.16),transparent 70%),repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px);background-size:cover;background-position:center}
.hero.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--background-color) 25%,rgba(20,23,28,.55))}
.hero .container{position:relative}
.hero h1{max-width:12ch}
.hero p.sub{color:var(--muted-color);font-size:1.15rem;max-width:520px;margin:18px 0 28px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.facts{display:grid;gap:1px;margin-top:44px;background:var(--line);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden}
.fact{background:var(--surface-color);padding:16px 18px}
.fact small{color:var(--muted-color);display:block}
.fact strong{font-weight:600}
@media(min-width:720px){.facts{grid-template-columns:repeat(3,1fr)}.hero{padding:110px 0 80px}}
/* SERVICES SECTION */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer}
.chip.active{background:var(--primary-color);border-color:var(--primary-color);color:#111;font-weight:600}
.grid{display:grid;gap:16px}
@media(min-width:640px){.grid.g2,.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface-color);border:1px solid var(--line);border-radius:var(--card-radius);padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.card:hover{border-color:var(--primary-color)}
.card img.cover{width:calc(100% + 44px);margin:-22px -22px 6px;height:170px;object-fit:cover;border-radius:var(--card-radius) var(--card-radius) 0 0}
.card .desc{color:var(--muted-color);flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.price{font-family:var(--font-head);font-size:1.45rem;font-weight:700;color:var(--primary-color)}
.price.custom{font-size:1.1rem;color:var(--muted-color);font-family:var(--font-body);font-weight:500}
.tag{align-self:flex-start;font-size:.8rem;background:var(--primary-color);color:#111;padding:2px 10px;border-radius:99px;font-weight:600}
.ic-box{width:44px;height:44px;border-radius:var(--button-radius);background:var(--secondary-color);color:var(--primary-color);display:grid;place-items:center}
.note{margin-top:18px;color:var(--muted-color);font-size:.92rem}
/* ABOUT, GALLERY, REVIEWS */
.about{display:grid;gap:28px}
.about p{color:var(--muted-color);white-space:pre-line}
.about img{border-radius:var(--card-radius);width:100%;object-fit:cover}
@media(min-width:860px){.about.has-img{grid-template-columns:1fr 1fr;align-items:center}}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:860px){.gal{grid-template-columns:repeat(3,1fr)}}
.gal button{border:0;padding:0;background:var(--surface-color);border-radius:var(--card-radius);overflow:hidden;cursor:zoom-in;aspect-ratio:4/3}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gal button:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex}
.lb img{max-height:88vh;object-fit:contain;border-radius:var(--card-radius)}
.lb button{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#111;font-size:1.5rem;cursor:pointer}
.stars{color:var(--primary-color);letter-spacing:2px}
/* LOCATION & CONTACTS */
.loc{display:grid;gap:20px}
@media(min-width:900px){.loc{grid-template-columns:1fr 1.3fr}}
.map{min-height:320px;border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--line);background:var(--surface-color)}
.map{position:relative}.map iframe{position:relative;z-index:1;width:100%;height:100%;min-height:320px;border:0}.map-fallback{position:absolute;inset:0;z-index:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:20px;color:var(--muted-color)}
.list{list-style:none;display:grid;gap:14px}
.list li{display:flex;gap:12px;align-items:flex-start}
.list .ic{color:var(--primary-color);margin-top:3px}
.list a:hover{color:var(--primary-color)}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.big-phone{font-family:var(--font-head);font-size:clamp(2rem,8vw,3rem);font-weight:800;color:var(--primary-color);display:inline-block;line-height:1.1}
/* FOOTER */
.footer{border-top:1px solid var(--line);padding:32px 0 36px;color:var(--muted-color)}
.footer .container{display:grid;gap:18px}
.footer nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.footer a:hover{color:var(--text-color)}
@media(min-width:760px){.footer .container{grid-template-columns:1fr auto;align-items:start}}
/* MOBILE BAR */
.mbar{display:none}
@media(max-width:959px){
 body.has-mbar{padding-bottom:76px}
 .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(20,23,28,.96);border-top:1px solid var(--line)}
}
.hcall{display:grid;place-items:center;width:44px;height:44px;margin-left:auto;border-radius:var(--button-radius);background:var(--primary-color);color:#111}
@media(min-width:960px){.hcall{display:none}}
@media(max-width:959px){.header .container{gap:10px}}
@media(max-width:560px){
 body{font-size:16px}
 .container{padding:0 16px}
 .section{padding:44px 0}
 .section-head{margin-bottom:22px}
 .hero{padding:44px 0 36px}
 .hero p.sub{font-size:1.05rem;margin:14px 0 22px}
 .cta-row{flex-direction:column}
 .cta-row .btn{width:100%;min-height:52px}
 .facts{margin-top:30px}
 .card{padding:18px}
 .card img.cover{width:calc(100% + 36px);margin:-18px -18px 6px}
 .card .foot .btn{width:100%}
 .map,.map iframe{min-height:280px}
 .brand{font-size:1.45rem}
}
@media(max-width:360px){h1{font-size:2.3rem}.btn{padding:0 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Увімкніть JavaScript. Телефон: <a href="tel:+380958880025">+380 95 888 00 25</a></p></noscript>

<script>
/* BUSINESS CONFIGURATION */
const BUSINESS = {
  name: "МаксСервіс",
  nameAccent: "Сервіс",              // частина назви, яка виділяється кольором (можна "")
  slogan: "Автосервіс у Кропивницькому",
  logo: "",                          // посилання на логотип (PNG/JPG/WebP/SVG); порожньо = текстова назва
  description: "Автосервіс у Кропивницькому. Телефонуйте або залиште заявку — зв'яжемося з вами.",

  city: "Кропивницький",
  region: "Кіровоградська область",
  address: "вул. Лавандова, 27 В",
  postalCode: "25000",
  country: "UA",

  phones: ["+380958880025"],         // перший номер — основний
  email: "",

  social: { instagram: "", facebook: "", telegram: "", whatsapp: "", viber: "" },
  // Telegram: "https://t.me/username"; WhatsApp: "https://wa.me/380XXXXXXXXX"; Viber: "viber://chat?number=%2B380XXXXXXXXX"

  workingHours: [
    // Приклад: { day: "Пн–Пт", hours: "09:00–18:00" }  — графік не надано, тому блок не показується
  ],

  maps: {
    url: "https://www.google.com/maps/search/?api=1&query=MaksServis+Lavandova+27V+Kropyvnytskyi",
    embedUrl: "",                    // якщо порожньо — карта будується автоматично за адресою
    extraText: ""                    // напр. «Заїзд з боку двору»
  },

  hero: {
    title: "Автосервіс МаксСервіс",
    subtitle: "Кропивницький, вул. Лавандова, 27 В. Зателефонуйте — узгодимо зручний час візиту.",
    image: "",                       // фото для фону першого екрана
    primaryButton: "Зателефонувати",
    secondaryButton: "Послуги"
  },

  /* priceType: "fixed" — ціна; "from" — від; "custom" — за запитом. hidden:true ховає послугу.
     УВАГА: перелік нижче — стартовий шаблон. Перевірте його з власником і залиште лише реальні послуги. Ціни не вказано. */
  services: [
    { name: "Комп'ютерна діагностика", description: "Перевірка електроніки автомобіля та зчитування помилок.", price: null, priceType: "custom", image: "", category: "", popular: false, hidden: false },
    { name: "Ремонт ходової частини", description: "Огляд і ремонт підвіски та рульового керування.", price: null, priceType: "custom", image: "", category: "", popular: false, hidden: false },
    { name: "Технічне обслуговування", description: "Заміна мастил і фільтрів, планове ТО.", price: null, priceType: "custom", image: "", category: "", popular: false, hidden: false },
    { name: "Ремонт гальмівної системи", description: "Діагностика та ремонт гальм.", price: null, priceType: "custom", image: "", category: "", popular: false, hidden: false }
  ],
  servicesNote: "Вартість залежить від автомобіля та обсягу робіт. Уточнюйте за телефоном.",

  about: { title: "Про нас", text: "", image: "" },     // порожній текст = секція прихована
  advantages: [],   // { icon: "check|clock|shield|wrench|pin|phone", title: "", text: "" }
  gallery: [],      // { src: "https://...", alt: "Опис" }
  reviews: []       // { name: "", text: "", rating: 5, date: "", url: "" } — лише справжні відгуки
};

/* DESIGN CONFIGURATION */
const THEME = {
  primary: "#ff6a1a", secondary: "#232a33", background: "#14171c", surface: "#1d2229",
  text: "#f4f5f7", muted: "#9aa3ae",
  fontBody: "'Barlow', system-ui, sans-serif", fontHead: "'Barlow Condensed', 'Arial Narrow', sans-serif",
  radius: "6px", buttonRadius: "4px", containerWidth: "1180px"
};

/* SECTIONS */
const SECTIONS = { header:true, hero:true, services:true, about:true, advantages:true, gallery:true, reviews:true, location:true, contacts:true, footer:true };
const SECTION_ORDER = ["hero","services","about","advantages","gallery","reviews","location","contacts"]; // змінюйте порядок
const TEXTS = {
  services: { title: "Послуги", nav: "Послуги", lead: "" },
  about: { nav: "Про нас" }, advantages: { title: "Чому обирають нас", nav: "Переваги" },
  gallery: { title: "Фото", nav: "Фото" }, reviews: { title: "Відгуки", nav: "Відгуки" },
  location: { title: "Як нас знайти", nav: "Адреса" }, contacts: { title: "Контакти", nav: "Контакти" },
  currency: "₴"
};

/* HELPERS */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const safeUrl = u => /^(https?:|viber:|tel:|mailto:)/i.test(u || "") ? esc(u) : "";
const telHref = p => "tel:" + String(p).replace(/[^\d+]/g, "");
const fmtPhone = p => { const d = String(p).replace(/\D/g, ""); return d.length === 12 ? `+${d.slice(0,2)} ${d.slice(2,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}` : p; };
const fullAddress = () => [BUSINESS.address, BUSINESS.city, BUSINESS.region, BUSINESS.postalCode].filter(Boolean).join(", ");
const mapsDirUrl = () => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(fullAddress());
const mapsOpenUrl = () => BUSINESS.maps.url || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(fullAddress());
const mapsQuery = () => { try { return new URL(BUSINESS.maps.url).searchParams.get("query") || ""; } catch (e) { return ""; } };
const mapsEmbed = () => BUSINESS.maps.embedUrl || ("https://www.google.com/maps?q=" + encodeURIComponent(mapsQuery() || fullAddress()) + "&hl=uk&z=16&output=embed");
const mainPhone = () => BUSINESS.phones[0] || "";
const visibleServices = () => BUSINESS.services.filter(s => !s.hidden);
const ICONS = {
  phone: '<path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z"/>',
  pin: '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/>',
  clock: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.400l4 2.300-.8 1.300L11 13V7z"/>',
  check: '<path d="M9 16.200 4.800 12l-1.400 1.400L9 19 21 7l-1.400-1.400z"/>',
  wrench: '<path d="M22 6.500a5 5 0 0 1-6.700 4.700L8 18.500a2.100 2.100 0 0 1-3-3l7.300-7.300A5 5 0 0 1 17.500 2l-3 3 .5 3.500L18.500 9z"/>',
  shield: '<path d="M12 2 4 5v6c0 5 3.400 9.700 8 11 4.600-1.300 8-6 8-11V5z"/>',
  mail: '<path d="M3 5h18v14H3zm9 8 8-6H4zm0 2L4 9v8h16V9z"/>',
  msg: '<path d="M4 4h16v12H8l-4 4z"/>',
  route: '<path d="m21.700 11.300-9-9a1 1 0 0 0-1.400 0l-9 9a1 1 0 0 0 0 1.400l9 9a1 1 0 0 0 1.400 0l9-9a1 1 0 0 0 0-1.400zM14 14v-3H10v4H8v-5a1 1 0 0 1 1-1h5V6l4 4z"/>'
};
const icon = (n, c = "ic") => `<svg class="${c}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[n] || ICONS.check}</svg>`;
const priceHtml = s => s.priceType === "fixed" && s.price != null ? `<span class="price">${esc(s.price)} ${TEXTS.currency}</span>`
  : s.priceType === "from" && s.price != null ? `<span class="price">від ${esc(s.price)} ${TEXTS.currency}</span>`
  : `<span class="price custom">Ціна за запитом</span>`;
const socialList = () => [["Instagram", BUSINESS.social.instagram], ["Facebook", BUSINESS.social.facebook], ["Telegram", BUSINESS.social.telegram], ["WhatsApp", BUSINESS.social.whatsapp], ["Viber", BUSINESS.social.viber]].filter(x => safeUrl(x[1]));

/* SECTION AVAILABILITY (порожні секції автоматично ховаються) */
const HAS = {
  hero: () => true,
  services: () => visibleServices().length > 0,
  about: () => !!BUSINESS.about.text,
  advantages: () => BUSINESS.advantages.length > 0,
  gallery: () => BUSINESS.gallery.length > 0,
  reviews: () => BUSINESS.reviews.length > 0,
  location: () => !!BUSINESS.address,
  contacts: () => !!(BUSINESS.phones.length || BUSINESS.email || socialList().length || BUSINESS.address)
};
const on = k => SECTIONS[k] && (!HAS[k] || HAS[k]());

/* HEADER */
function renderHeader() {
  const b = BUSINESS, ph = mainPhone();
  const nm = b.nameAccent && b.name.endsWith(b.nameAccent) ? `${esc(b.name.slice(0, -b.nameAccent.length))}<b>${esc(b.nameAccent)}</b>` : esc(b.name);
  const brand = b.logo ? `<img src="${safeUrl(b.logo)}" alt="${esc(b.name)}" onerror="this.replaceWith(document.createTextNode('${esc(b.name)}'))">` : nm;
  const links = SECTION_ORDER.filter(k => k !== "hero" && on(k) && TEXTS[k]?.nav).map(k => `<a href="#${k}">${esc(TEXTS[k].nav)}</a>`).join("");
  return `<header class="header"><div class="container">
    <a class="brand" href="#top" aria-label="${esc(b.name)}">${brand}</a>
    <nav class="nav" aria-label="Меню">${links}</nav>
    <div class="head-actions">${ph ? `<a class="head-phone" href="${telHref(ph)}">${esc(fmtPhone(ph))}</a>` : ""}${ph ? `<a class="btn sm" href="${telHref(ph)}">${icon("phone")} ${esc(b.hero.primaryButton)}</a>` : ""}</div>
    ${ph ? `<a class="hcall" href="${telHref(ph)}" aria-label="Зателефонувати">${icon("phone")}</a>` : ""}
    <button class="burger" id="burger" aria-label="Меню" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg></button>
  </div><nav class="mnav" id="mnav">${links}</nav></header>`;
}

/* HERO SECTION */
function renderHero() {
  const b = BUSINESS, ph = mainPhone(), h = b.hero;
  const facts = [["Адреса", `${b.address}, ${b.city}`], ph && ["Телефон", `<a href="${telHref(ph)}">${esc(fmtPhone(ph))}</a>`], b.workingHours[0] && ["Графік", `${esc(b.workingHours[0].day)}: ${esc(b.workingHours[0].hours)}`]].filter(Boolean);
  const bg = h.image ? ` style="background-image:url('${esc(h.image)}')"` : "";
  return `<section class="hero${h.image ? " has-img" : ""}" id="hero"${bg}><div class="container">
    <h1>${esc(h.title)}</h1><p class="sub">${esc(h.subtitle)}</p>
    <div class="cta-row">${ph ? `<a class="btn" href="${telHref(ph)}">${icon("phone")} ${esc(h.primaryButton)}: ${esc(fmtPhone(ph))}</a>` : ""}${on("services") ? `<a class="btn ghost" href="#services">${esc(h.secondaryButton)}</a>` : ""}</div>
    <div class="facts">${facts.map(f => `<div class="fact"><small>${f[0]}</small><strong>${f[0] === "Телефон" ? f[1] : esc(f[1])}</strong></div>`).join("")}</div>
  </div></section>`;
}

/* SERVICES SECTION */
function renderServices() {
  const list = visibleServices(), cats = [...new Set(list.map(s => s.category).filter(Boolean))];
  const chips = cats.length ? `<div class="chips" id="chips"><button class="chip active" data-cat="">Усі</button>${cats.map(c => `<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "";
  const cards = list.map((s, i) => `<article class="card" data-cat="${esc(s.category || "")}">
    ${s.image ? `<img class="cover" src="${safeUrl(s.image)}" alt="${esc(s.name)}" loading="lazy" onerror="this.remove()">` : `<div class="ic-box">${icon("wrench")}</div>`}
    ${s.popular ? '<span class="tag">Популярна послуга</span>' : ""}
    <h3>${esc(s.name)}</h3><p class="desc">${esc(s.description)}</p>
    <div class="foot">${priceHtml(s)}${mainPhone() ? `<a class="btn sm ghost" href="${telHref(mainPhone())}">${icon("phone")} Зателефонувати</a>` : ""}</div></article>`).join("");
  return `<section class="section" id="services"><div class="container"><div class="section-head"><h2>${esc(TEXTS.services.title)}</h2>${TEXTS.services.lead ? `<p>${esc(TEXTS.services.lead)}</p>` : ""}</div>${chips}<div class="grid g3" id="svcGrid">${cards}</div>${BUSINESS.servicesNote ? `<p class="note">${esc(BUSINESS.servicesNote)}</p>` : ""}</div></section>`;
}

/* ABOUT / ADVANTAGES / GALLERY / REVIEWS */
function renderAbout() {
  const a = BUSINESS.about;
  return `<section class="section" id="about"><div class="container"><div class="about${a.image ? " has-img" : ""}"><div><h2>${esc(a.title)}</h2><p style="margin-top:14px">${esc(a.text)}</p></div>${a.image ? `<img src="${safeUrl(a.image)}" alt="${esc(BUSINESS.name)}" loading="lazy" onerror="this.remove()">` : ""}</div></div></section>`;
}
function renderAdvantages() {
  return `<section class="section" id="advantages"><div class="container"><div class="section-head"><h2>${esc(TEXTS.advantages.title)}</h2></div><div class="grid g3">${BUSINESS.advantages.map(a => `<div class="card"><div class="ic-box">${icon(a.icon)}</div><h3>${esc(a.title)}</h3><p class="desc">${esc(a.text)}</p></div>`).join("")}</div></div></section>`;
}
function renderGallery() {
  return `<section class="section" id="gallery"><div class="container"><div class="section-head"><h2>${esc(TEXTS.gallery.title)}</h2></div><div class="gal">${BUSINESS.gallery.map(g => `<button type="button" data-src="${safeUrl(g.src)}" data-alt="${esc(g.alt)}"><img src="${safeUrl(g.src)}" alt="${esc(g.alt)}" loading="lazy" onerror="this.closest('button').remove()"></button>`).join("")}</div></div></section>`;
}
function renderReviews() {
  return `<section class="section" id="reviews"><div class="container"><div class="section-head"><h2>${esc(TEXTS.reviews.title)}</h2></div><div class="grid g3">${BUSINESS.reviews.map(r => `<article class="card"><div class="stars" aria-label="Оцінка ${esc(r.rating)} з 5">${"★".repeat(Math.max(0, Math.min(5, +r.rating || 0)))}</div><p class="desc">${esc(r.text)}</p><strong>${esc(r.name)}</strong>${r.date ? `<small class="muted">${esc(r.date)}</small>` : ""}${safeUrl(r.url) ? `<a class="muted" href="${safeUrl(r.url)}" target="_blank" rel="noopener">Джерело</a>` : ""}</article>`).join("")}</div></div></section>`;
}

/* LOCATION & CONTACTS */
function hoursHtml() {
  return BUSINESS.workingHours.length ? `<li>${icon("clock")}<div class="hours">${BUSINESS.workingHours.map(h => `<span>${esc(h.day)}</span><strong>${esc(h.hours)}</strong>`).join("")}</div></li>` : "";
}
function renderLocation() {
  const ph = mainPhone();
  return `<section class="section" id="location"><div class="container"><div class="section-head"><h2>${esc(TEXTS.location.title)}</h2></div><div class="loc"><div>
    <ul class="list"><li>${icon("pin")}<div>${esc(fullAddress())}${BUSINESS.maps.extraText ? `<div class="muted">${esc(BUSINESS.maps.extraText)}</div>` : ""}</div></li>
    ${ph ? `<li>${icon("phone")}<a href="${telHref(ph)}">${esc(fmtPhone(ph))}</a></li>` : ""}${hoursHtml()}</ul>
    <div class="cta-row" style="margin-top:22px"><a class="btn" href="${esc(mapsDirUrl())}" target="_blank" rel="noopener">${icon("route")} Побудувати маршрут</a><a class="btn ghost" href="${safeUrl(mapsOpenUrl())}" target="_blank" rel="noopener">Відкрити в Google Maps</a></div></div>
    <div class="map"><div class="map-fallback"><p>${esc(fullAddress())}</p><a class="btn sm" href="${safeUrl(mapsOpenUrl())}" target="_blank" rel="noopener">${icon("pin")} Відкрити карту</a></div><iframe src="${esc(mapsEmbed())}" title="Карта: ${esc(BUSINESS.name)}" loading="lazy" allowfullscreen></iframe></div></div></div></section>`;
}
function renderContacts() {
  const b = BUSINESS, soc = socialList();
  return `<section class="section" id="contacts"><div class="container"><div class="section-head"><h2>${esc(TEXTS.contacts.title)}</h2></div>
    ${mainPhone() ? `<a class="big-phone" href="${telHref(mainPhone())}">${esc(fmtPhone(mainPhone()))}</a>` : ""}
    <ul class="list" style="margin-top:20px">
    ${b.phones.slice(1).map(p => `<li>${icon("phone")}<a href="${telHref(p)}">${esc(fmtPhone(p))}</a></li>`).join("")}
    ${b.email ? `<li>${icon("mail")}<a href="mailto:${esc(b.email)}">${esc(b.email)}</a></li>` : ""}
    ${b.address ? `<li>${icon("pin")}<span>${esc(fullAddress())}</span></li>` : ""}
    ${soc.map(s => `<li>${icon("msg")}<a href="${safeUrl(s[1])}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul></div></section>`;
}

/* FOOTER */
function renderFooter() {
  const links = SECTION_ORDER.filter(k => k !== "hero" && on(k) && TEXTS[k]?.nav).map(k => `<a href="#${k}">${esc(TEXTS[k].nav)}</a>`).join("");
  return `<footer class="footer"><div class="container"><div><strong style="color:var(--text-color)">${esc(BUSINESS.name)}</strong><div>${esc(BUSINESS.slogan)}</div>${mainPhone() ? `<div><a href="${telHref(mainPhone())}">${esc(fmtPhone(mainPhone()))}</a></div>` : ""}<div>${esc(fullAddress())}</div></div><nav aria-label="Навігація внизу">${links}</nav><div>© ${new Date().getFullYear()} ${esc(BUSINESS.name)}</div></div></footer>`;
}
function renderMobileBar() {
  const ph = mainPhone();
  if (!ph) return "";
  return `<div class="mbar"><a class="btn" href="${telHref(ph)}">${icon("phone")} Зателефонувати</a><a class="btn ghost" href="${esc(mapsDirUrl())}" target="_blank" rel="noopener">${icon("route")} Маршрут</a></div>`;
}

/* DESIGN: THEME -> CSS VARIABLES */
function applyTheme() {
  const r = document.documentElement.style, t = THEME;
  r.setProperty("--primary-color", t.primary); r.setProperty("--secondary-color", t.secondary);
  r.setProperty("--background-color", t.background); r.setProperty("--surface-color", t.surface);
  r.setProperty("--text-color", t.text); r.setProperty("--muted-color", t.muted);
  r.setProperty("--font-body", t.fontBody); r.setProperty("--font-head", t.fontHead);
  r.setProperty("--card-radius", t.radius); r.setProperty("--button-radius", t.buttonRadius); r.setProperty("--container-width", t.containerWidth);
}

/* SEO: Schema.org LocalBusiness (лише реальні дані) */
function applySEO() {
  const b = BUSINESS, s = { "@context": "https://schema.org", "@type": "AutoRepair", name: b.name, description: b.description,
    address: { "@type": "PostalAddress", streetAddress: b.address, addressLocality: b.city, addressRegion: b.region, postalCode: b.postalCode, addressCountry: b.country } };
  if (mainPhone()) s.telephone = mainPhone();
  if (b.email) s.email = b.email;
  if (b.logo) s.image = b.logo;
  const same = socialList().map(x => x[1]); if (same.length) s.sameAs = same;
  if (b.workingHours.length) s.openingHours = b.workingHours.map(h => h.day + " " + h.hours);
  const el = document.createElement("script"); el.type = "application/ld+json"; el.textContent = JSON.stringify(s); document.head.appendChild(el);
  document.title = `${b.name} — ${b.slogan.toLowerCase()}`;
}

/* INTERACTIONS */
function bindInteractions() {
  const burger = $("#burger"), mnav = $("#mnav");
  if (burger) {
    burger.addEventListener("click", () => { const o = mnav.classList.toggle("open"); burger.setAttribute("aria-expanded", o); });
    mnav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { mnav.classList.remove("open"); burger.setAttribute("aria-expanded", false); }));
  }
  const chips = $("#chips");
  if (chips) chips.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    chips.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === c));
    document.querySelectorAll("#svcGrid .card").forEach(card => card.hidden = !!c.dataset.cat && card.dataset.cat !== c.dataset.cat);
  });
  const lb = $("#lb"), img = $("#lbImg");
  document.querySelectorAll(".gal button").forEach(b => b.addEventListener("click", () => { img.src = b.dataset.src; img.alt = b.dataset.alt; lb.classList.add("open"); }));
  const close = () => lb.classList.remove("open");
  $("#lbClose").addEventListener("click", close);
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
}

/* INITIALIZATION */
function init() {
  applyTheme(); applySEO();
  const R = { hero: renderHero, services: renderServices, about: renderAbout, advantages: renderAdvantages, gallery: renderGallery, reviews: renderReviews, location: renderLocation, contacts: renderContacts };
  const main = SECTION_ORDER.filter(on).map(k => R[k]()).join("");
  $("#app").innerHTML = `<span id="top"></span>${SECTIONS.header ? renderHeader() : ""}<main>${main}</main>${SECTIONS.footer ? renderFooter() : ""}${renderMobileBar()}`;
  document.body.classList.toggle("has-mbar", !!mainPhone());
  bindInteractions();
}
init();
</script>
</body>
</html>
